[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL at DATABASE_URL (AI layer mocked)",
    "e2e: starts a real uvicorn server; AI tests also require GEMINI_API_KEY",
]
