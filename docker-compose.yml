services:
  database:
    # image: docker.io/vinilmt/vestigium_database:latest
    build: ./database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vestigium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    # image: docker.io/vinilmt/vestigium_backend:latest
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/vestigium
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    # image: docker.io/vinilmt/vestigium_frontend:latest
    build: ./frontend
    environment:
      API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
